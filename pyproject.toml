[project]
name = "not-a-ctrl-f"
version = "0.1.0"
description = "Busca local por palavra-chave e semântica em documentos, imagens e áudio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
    "soundfile>=0.14.0",
    "watchdog==6.0.0",
]

[project.scripts]
not-a-ctrl-f = "not_a_ctrl_f:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
