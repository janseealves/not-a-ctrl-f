[project]
name = "not-a-ctrl-f"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "soundfile>=0.14.0",
]

[project.scripts]
not-a-ctrl-f = "not_a_ctrl_f:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
